services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: streamx
      POSTGRES_USER: streamx
      POSTGRES_PASSWORD: streamx
    ports: ["5432:5432"]
    volumes: ["./sql/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro"]
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
